{% extends 'base.html' %}

{% block content %}
<section class="about-section">
    <div class="container">
        <div class="profile">
            <img src="{% static 'images/profile.jpg' %}" alt="Your Name" class="profile-image">
            <div class="profile-info">
                <h2>About Me</h2>
                <p>Full-stack developer with 5+ years experience building web applications</p>
                <p>Expertise in Python/Django, JavaScript, and cloud deployments</p>
                <a href="{% static 'pdfs/resume.pdf' %}" class="cta-button">Download Resume</a>
            </div>
        </div>

        <div class="skills">
            <h3>Technical Skills</h3>
            <div class="skill-grid">
                <div class="skill-item">Python/Django</div>
                <div class="skill-item">JavaScript/React</div>
                <div class="skill-item">AWS/Cloud</div>
                <div class="skill-item">REST APIs</div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
